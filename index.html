<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>verifAI</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<style>
  :root { --mgr: #B02A6E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mgr: #F29AC8; } }
  :root[data-theme="dark"] { --mgr: #F29AC8; }
  .start { max-width: 980px; margin: 0 auto; padding-block: 56px 40px; display: flex; flex-direction: column; gap: 36px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800; color: var(--text); }
  .brand .ai { color: var(--ai); }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .role { position: relative; text-align: left; display: flex; flex-direction: column; gap: 16px; padding: 28px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font: inherit; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .role:hover { border-color: var(--accent); box-shadow: 0 12px 32px rgba(40, 40, 120, 0.12); transform: translateY(-2px); }
  .role:focus-visible { outline: 3px solid rgba(91,91,214,0.45); outline-offset: 3px; }
  .role .points { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.5; color: var(--text2); }
  .role .points > span { display: list-item; list-style: disc; }
  .role .go { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--accent-strong); margin-top: auto; }
  .role .who-row { display: flex; align-items: center; gap: 14px; }
  .role .big-avatar { width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 18px; }
  .role .current { position: absolute; top: 20px; right: 20px; }
  @media (prefers-reduced-motion: reduce) { .role { transition: none; } .role:hover { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="start">
    <div class="stack" style="gap:18px">
      <span class="brand">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5B5BD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 6c5 0 4 6 7 6"/><path d="M8.5 18c5 0 4-6 7-6"/></svg>
        <span>verif<span class="ai">AI</span></span>
      </span>
      <div class="stack" style="gap:8px">
        <h1 class="title-xl" style="text-wrap:balance">Learn it, prove it, then let AI build with it</h1>
        <p class="muted" style="font-size:17px;max-width:640px">Choose how you want to use verifAI today. You can switch roles any time from the header.</p>
      </div>
    </div>

    <div class="roles" role="group" aria-label="Choose your role">
      <button class="role" type="button" data-role="dev">
        <span class="who-row">
          <span class="big-avatar" style="background:#5B5BD6">AL</span>
          <span class="stack" style="gap:2px"><span class="eyebrow accent">Developer</span><span style="font-size:20px;font-weight:800">Alex Lindner</span><span class="small muted">Backend · Platform team</span></span>
        </span>
        <span class="points">
          <span>Learn concepts in your learning tree</span>
          <span>Prove them with challenges and guided tasks</span>
          <span>Use the AI assistant for what you've already learned</span>
        </span>
        <span class="pill pill-blue current" hidden>Current role</span>
        <span class="go">Continue as developer <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </button>

      <button class="role" type="button" data-role="manager">
        <span class="who-row">
          <span class="big-avatar" style="background:#C0347A">MK</span>
          <span class="stack" style="gap:2px"><span class="eyebrow" style="color:var(--mgr)">Manager</span><span style="font-size:20px;font-weight:800">Maria Keller</span><span class="small muted">Team lead · Platform team</span></span>
        </span>
        <span class="points">
          <span>See your team's progress and developer levels</span>
          <span>Set learning goals with deadlines</span>
          <span>Adjust what guided tasks teach each person</span>
        </span>
        <span class="pill pill-blue current" hidden>Current role</span>
        <span class="go">Continue as manager <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </button>
    </div>

    <div class="footer-row" style="border-top:1px solid var(--border)">
      <span>Demo with sample data. Progress is saved in this browser only.</span>
      <a href="architecture.html" style="font-weight:700">System architecture</a>
    </div>
  </div>
</main>

<script>
(function () {
  var cur = RW.role();
  document.querySelectorAll('[data-role]').forEach(function (b) {
    var r = b.getAttribute('data-role');
    b.querySelector('.current').hidden = r !== cur;
    b.addEventListener('click', function () {
      RW.setRole(r);
      location.href = RW.homeFor(r);
    });
  });
})();
</script>

</body>
</html>
