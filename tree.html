<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>verifAI · Learning tree</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<header id="rw-header"></header>
<main class="wrap stack">

  <div class="row">
    <section class="card grow" style="flex-direction:row;flex-wrap:wrap;gap:20px;align-items:center" aria-label="Selected concept" aria-live="polite">
      <div style="flex:1 1 300px;display:flex;flex-direction:column;gap:6px">
        <span class="eyebrow" id="d-eyebrow"></span>
        <h1 class="title-l" id="d-name"></h1>
        <p class="muted" style="font-size:14px" id="d-desc"></p>
        <span class="small muted"><b style="color:var(--text)">Requires:</b> <span id="d-req"></span></span>
      </div>
      <div style="flex:0 1 300px;display:flex;flex-direction:column;gap:10px" id="d-actions"></div>
    </section>
    <section class="card side" aria-label="Assistant scope">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5BD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
        <h2 style="font-size:15px;font-weight:800" id="a-title"></h2>
      </div>
      <p class="muted" style="font-size:14px" id="a-line"></p>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="a-chips"></div>
      <p class="muted" style="font-size:14px">With a detailed prompt it acts on its own, and still asks about anything you left open.</p>
      <a class="btn" href="assistant.html">Ask the assistant</a>
    </section>
  </div>

  <div class="tree-scroll"><div class="tree" id="tree"></div></div>

  <div class="legend">
    <span><span class="dot" style="background:#5B5BD6"></span>Verified</span>
    <span><span class="dot" style="background:conic-gradient(#5B5BD6 60%, var(--track) 0)"></span>In progress</span>
    <span><span class="dot" style="border:3px solid var(--track)"></span>Ready to start</span>
    <span><span class="dot" style="background:var(--locked);border:1px solid var(--chip-border)"></span>Locked</span>
    <span><span class="dot" style="width:16px;height:16px;background:#D97706"></span>Learning in a guided task</span>
    <span><span class="chip" style="font-size:11px;padding:1px 6px">15.12.</span>Team goal deadline</span>
    <span><svg width="28" height="8" aria-hidden="true"><path d="M1 4h26" style="stroke:var(--faded)" stroke-width="1.5" stroke-dasharray="4 4"/></svg>Same idea in another language: shorter challenge</span>
  </div>
</main>
<footer id="rw-footer"></footer>

<script>
RW.initPage('tree.html');
(function () {
  var D = RW.D, esc = RW.esc;
  var COLX = [344, 572, 800, 1028, 1252], ROWH = 172, HEAD = 64, W = 1340;
  var params = new URLSearchParams(location.search);
  var selected = params.get('node') || (RW.nextUp() ? RW.nextUp().id : 'py-vars');
  if (!RW.NODE[selected]) selected = 'py-vars';

  var CHECK = '<svg class="check" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var LOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faded)"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var TOOL = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>';
  var LABEL = { verified: 'Verified', learning: 'In progress', ready: 'Ready to start', locked: 'Locked' };

  function layout() {
    var top = HEAD, lanes = {};
    D.lanes.forEach(function (l) {
      var h = 36 + l.rows * ROWH + 8;
      lanes[l.id] = { top: top, h: h };
      top += h;
    });
    return { lanes: lanes, H: top };
  }

  function render() {
    var L = layout(), nodes = RW.allNodes(), byId = {};
    var next = RW.nextUp();
    nodes.forEach(function (n) {
      var lt = L.lanes[n.lane];
      var y = lt.top + 30 + n.row * ROWH;
      Object.assign(n, { cx: COLX[n.col], y: y, cy: y + 40 });
      byId[n.id] = n;
    });

    var html = '';
    // lane bands
    D.lanes.forEach(function (l) {
      var lt = L.lanes[l.id];
      html += '<div class="lane-band" style="top:' + lt.top + 'px;height:' + lt.h + 'px"><div class="lbl-bg"></div><div class="accent" style="background:' + l.c + '"></div></div>';
    });

    // edges
    function curve(a, b) {
      if (a.cx === b.cx) return 'M ' + a.cx + ' ' + (a.cy + 32) + ' L ' + b.cx + ' ' + (b.cy - 32);
      var x1 = a.cx + 34, x2 = b.cx - 34, dx = Math.max(60, (x2 - x1) / 2);
      return 'M ' + x1 + ' ' + a.cy + ' C ' + (x1 + dx) + ' ' + a.cy + ', ' + (x2 - dx) + ' ' + b.cy + ', ' + x2 + ' ' + b.cy;
    }
    var paths = '';
    nodes.forEach(function (b) {
      b.req.forEach(function (rid) {
        var a = byId[rid];
        var active = a.status === 'verified' && (b.status === 'verified' || b.status === 'learning');
        var op = active ? 0.9 : (b.status === 'locked' ? 0.22 : 0.4);
        var w = active ? 2.6 : 1.5;
        var dash = active && b.status === 'learning' ? '8 6' : 'none';
        paths += '<path d="' + curve(a, b) + '" fill="none" stroke="' + a.c + '" stroke-opacity="' + op + '" stroke-width="' + w + '" stroke-dasharray="' + dash + '" stroke-linecap="round"/>';
      });
    });
    D.related.forEach(function (r) {
      paths += '<path d="' + curve(byId[r[0]], byId[r[1]]) + '" fill="none" style="stroke:var(--faded)" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="5 5"/>';
    });
    html += '<svg class="edges" width="' + W + '" height="' + L.H + '" viewBox="0 0 ' + W + ' ' + L.H + '" aria-hidden="true">' + paths + '</svg>';

    // stage headers
    html += '<div style="position:absolute;left:0;top:0;width:' + W + 'px;height:64px;border-bottom:1px solid var(--border)"></div>';
    D.stages.forEach(function (s, i) {
      html += '<div class="stage" style="left:' + (COLX[i] - 40) + 'px"><b>' + (i + 1) + '</b>' + s + '</div>';
    });

    // lane labels
    D.lanes.forEach(function (l) {
      var lt = L.lanes[l.id], st = RW.laneStats(l.id), lv = RW.level(l.id), tint = l.c + '1A';
      html += '<div class="lane-label" style="top:' + (lt.top + Math.round(lt.h / 2) - 64) + 'px"><strong>' + l.name + '</strong>' +
        '<span style="align-self:flex-start;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:' + tint + ';color:var(--text)">Lv ' + lv.num + ' · ' + lv.name + ' · ' + lv.xp + ' XP</span>' +
        '<span class="muted" style="font-size:14px">' + l.sub + ' · ' + st.ver + ' of ' + st.total + ' verified</span>' +
        '<div class="bar" style="height:4px;margin-top:6px"><span style="width:' + Math.round(st.ver / st.total * 100) + '%;background:' + l.c + '"></span></div></div>';
    });

    // nodes
    nodes.forEach(function (n) {
      var lane = RW.LANE[n.lane], st = n.status, circle, inner = '';
      if (st === 'verified') {
        circle = 'background:radial-gradient(circle at 35% 30%, ' + lane.hi + ' 0%, ' + lane.c + ' 72%);border:3px solid ' + lane.ring + ';box-shadow:0 0 0 6px ' + lane.c + '1F, 0 10px 26px ' + lane.c + '59';
      } else if (st === 'learning') {
        circle = 'background:conic-gradient(' + lane.c + ' ' + n.pct + '%, var(--track) 0);box-shadow:0 6px 18px ' + lane.c + '26';
        inner = '<span class="inner" style="color:' + lane.c + '">' + lane.tag + '</span>';
      } else if (st === 'ready') {
        circle = 'background:var(--track);box-shadow:0 4px 12px ' + lane.c + '14';
        inner = '<span class="inner" style="color:' + lane.c + '">' + lane.tag + '</span>';
      } else {
        circle = 'background:var(--track)';
        inner = '<span class="inner" style="background:var(--locked)">' + LOCK + '</span>';
      }
      var isNext = next && next.id === n.id;
      html += '<button class="tnode ' + st + '" data-id="' + n.id + '" ' + (n.id === selected ? 'aria-pressed="true"' : 'aria-pressed="false"') + ' aria-label="' + esc(n.name + ', ' + n.laneName + ', ' + LABEL[st]) + '" style="left:' + (n.cx - 84) + 'px;top:' + n.y + 'px">' +
        '<span class="circle" style="' + circle + '">' + inner + (st === 'verified' ? CHECK : '') +
        (isNext ? '<span class="next" style="background:' + lane.c + '">NEXT</span>' : '') +
        (n.inTask ? '<span class="task-dot" title="Learning in a guided task">' + TOOL + '</span>' : '') +
        '</span><span class="name">' + esc(n.name) + '</span>' +
        (n.goal ? '<span class="chip">' + n.goal + '</span>' : '') + '</button>';
    });

    var tree = document.getElementById('tree');
    tree.style.height = L.H + 'px';
    tree.innerHTML = html;
    tree.querySelectorAll('.tnode').forEach(function (b) {
      b.addEventListener('click', function () {
        selected = b.getAttribute('data-id');
        history.replaceState(null, '', '?node=' + selected);
        render();
      });
    });
    detail(byId[selected]);
  }

  function detail(n) {
    var st = RW.laneStats(n.lane);
    document.getElementById('d-eyebrow').textContent = n.laneName + ' · ' + LABEL[n.status];
    document.getElementById('d-eyebrow').style.color = n.c;
    document.getElementById('d-name').textContent = n.name;
    document.getElementById('d-desc').textContent = n.desc;
    document.getElementById('d-req').textContent = n.reqNames;

    var a = '';
    if (n.goal && n.goal !== 'optional') a += '<span class="small muted" style="display:flex;align-items:center;gap:8px"><span class="chip">' + n.goal + '</span>Team goal deadline · set by ' + RW.D.manager.name + '</span>';
    if (n.goal === 'optional') a += '<span class="small muted">Optional for your team</span>';
    if (n.status === 'verified') {
      a += '<div class="note note-soft"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="' + n.c + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>' +
        (n.byManager ? 'Marked as known by ' + RW.D.manager.name + ' on ' + n.date : (n.byTask ? 'Verified in a guided task check on ' : 'Verified by challenge on ') + n.date) + ' · assistant unlocked</span></div>';
    } else if (n.inTask) {
      var tk = RW.task(n.taskId);
      a += '<a class="btn btn-primary" href="guided-task.html?task=' + n.taskId + '" style="flex-direction:column;gap:0;min-height:54px;background:' + n.c + ';border-color:' + n.c + '"><span>Continue guided task</span><span style="font-size:12px;font-weight:600;opacity:.9">' + esc(tk ? tk.title : '') + ' · learning this while you build</span></a>';
    } else {
      a += '<span class="small muted">Worth <b style="color:var(--text)">+' + ((n.col + 1) * 10) + ' XP</b> toward your developer level</span>';
      if (n.status === 'locked') {
        a += '<div class="note note-soft">Challenge opens once the requirements are verified.</div>';
      } else {
        a += '<a class="btn btn-primary" href="' + (n.id === 'py-async' ? 'challenge.html' : 'challenge.html?concept=' + n.id) + '" style="background:' + n.c + ';border-color:' + n.c + '">Start verification challenge</a>';
      }
      a += '<a class="btn" href="guided-task.html?learn=' + n.id + '">Learn it in a guided task</a>';
    }
    document.getElementById('d-actions').innerHTML = a;

    document.getElementById('a-title').textContent = 'Assistant in ' + n.laneName;
    document.getElementById('a-line').innerHTML = n.status === 'verified'
      ? 'You proved <b style="color:var(--text)">' + esc(n.name) + '</b>, so the assistant may write code with it. It builds with your ' + st.ver + ' verified ' + n.laneName + ' concepts:'
      : 'Until you verify <b style="color:var(--text)">' + esc(n.name) + '</b>, the assistant explains it and links the lesson, but won’t write that code for you. It builds with your ' + st.ver + ' verified ' + n.laneName + ' concepts:';
    document.getElementById('a-chips').innerHTML = (st.verifiedNames.length ? st.verifiedNames : ['None yet']).map(function (v) {
      return '<span class="tag tag-accent">' + esc(v) + '</span>';
    }).join('');
  }

  render();
})();
</script>
</body>
</html>
